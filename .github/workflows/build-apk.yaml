name: Build Nalamudan APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (leave blank for default)'
        required: false
        default: 'https://ai-health-tracker-yycb.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

