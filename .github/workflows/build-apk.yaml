name: Build Nalamudan APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (leave blank for default)'
        required: false
        default: 'https://ai-health-tracker-yycb.onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the official action — v4 does NOT try to install the obsolete 'tools' package
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build React Vite app
        working-directory: frontend
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || secrets.VITE_API_URL || 'https://ai-health-tracker-yycb.onrender.com' }}
          NODE_ENV: production
        run: |
          npm run build
          echo "Vite build complete"

      - name: Setup Capacitor Android project
        working-directory: frontend
        run: |
          rm -rf android
          npx cap init Nalamudan com.nalamudan.healthtracker --web-dir=dist 2>/dev/null || true
          npx cap add android
          echo "Capacitor Android project created"

      - name: Sync Capacitor assets
        working-directory: frontend
        run: |
          npx cap sync android
          echo "Capacitor sync complete"

      - name: Install Nalamudan launcher icons
        run: |
          RES="frontend/android/app/src/main/res"
          ICON_SRC="frontend/public/Icons"

          # Density folders — note: xxxhdpi (not xxxdpi)
          # Capacitor recreates android/ on every CI run, so install checked-in
          # icons into the generated project after cap add and cap sync.
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$folder"

            # ic_launcher (square/legacy icon)
            src_launcher="$ICON_SRC/$folder/ic_launcher.png"
            if [ "$folder" = "mipmap-xxxhdpi" ] && [ -s "$ICON_SRC/ic_launcher_512.png" ]; then
              src_launcher="$ICON_SRC/ic_launcher_512.png"
            fi
            if [ -s "$src_launcher" ]; then
              cp "$src_launcher" "$RES/$folder/ic_launcher.png"
            else
              cp frontend/public/android-chrome-512x512.png "$RES/$folder/ic_launcher.png"
              echo "Fallback ic_launcher for $folder"
            fi

            # ic_launcher_round
            src_round="$ICON_SRC/$folder/ic_launcher_round.png"
            if [ -s "$src_round" ]; then
              cp "$src_round" "$RES/$folder/ic_launcher_round.png"
            else
              cp "$RES/$folder/ic_launcher.png" "$RES/$folder/ic_launcher_round.png"
            fi

            # ic_launcher_foreground — used by the adaptive icon XML in mipmap-anydpi-v26.
            # Use the same source PNG as the launcher icon, scaled to 108dp safe-zone.
            # (The adaptive icon system will mask it; using the same PNG is correct.)
            cp "$RES/$folder/ic_launcher.png" "$RES/$folder/ic_launcher_foreground.png"
          done

          # Explicitly create adaptive icons so Android 8+ uses these app assets,
          # independent of which default icon files cap add generated.
          mkdir -p "$RES/mipmap-anydpi-v26"
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          done

          # Fail the workflow instead of publishing an APK with missing launcher assets.
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            test -s "$RES/$folder/ic_launcher.png"
            test -s "$RES/$folder/ic_launcher_round.png"
            test -s "$RES/$folder/ic_launcher_foreground.png"
          done
          test -s "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          test -s "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Icons installed"

      - name: Install splash screen
        run: |
          RES="frontend/android/app/src/main/res"
          mkdir -p "$RES/drawable"
          if [ -f "frontend/public/Icons/splash.png" ]; then
            cp frontend/public/Icons/splash.png "$RES/drawable/splash.png"
            echo "Splash installed from Icons/splash.png"
          elif [ -f "frontend/public/Icons/splash_1080.png" ]; then
            cp frontend/public/Icons/splash_1080.png "$RES/drawable/splash.png"
            echo "Splash installed from Icons/splash_1080.png"
          fi

      - name: Write Android resource files
        run: |
          python3 << 'PYEOF'
          import os

          RES = "frontend/android/app/src/main/res"
          os.makedirs(f"{RES}/values", exist_ok=True)
          os.makedirs(f"{RES}/xml", exist_ok=True)

          files = {}

          files[f"{RES}/values/strings.xml"] = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <string name="app_name">Nalamudan</string>\n'
              '    <string name="title_activity_main">Nalamudan</string>\n'
              '    <string name="custom_url_scheme">nalamudan</string>\n'
              '</resources>\n'
          )

          # ic_launcher_background is defined here as a color.
          # Capacitor may also generate ic_launcher_background.xml — we delete it below
          # to avoid duplicate resource errors.
          files[f"{RES}/values/colors.xml"] = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="colorPrimary">#1A237E</color>\n'
              '    <color name="colorPrimaryDark">#0D1757</color>\n'
              '    <color name="colorAccent">#00E5A0</color>\n'
              '    <color name="splash_background">#1A237E</color>\n'
              '    <color name="ic_launcher_background">#FFFFFF</color>\n'
              '</resources>\n'
          )

          # Remove Capacitor-generated ic_launcher_background.xml to avoid duplicate
          cap_bg = f"{RES}/values/ic_launcher_background.xml"
          if os.path.exists(cap_bg):
              os.remove(cap_bg)
              print(f"Removed duplicate: {cap_bg}")

          files[f"{RES}/values/styles.xml"] = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">\n'
              '        <item name="colorPrimary">@color/colorPrimary</item>\n'
              '        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>\n'
              '        <item name="colorAccent">@color/colorAccent</item>\n'
              '        <item name="android:windowBackground">@color/splash_background</item>\n'
              '    </style>\n'
              '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">\n'
              '        <item name="android:windowBackground">@color/splash_background</item>\n'
              '        <item name="android:windowFullscreen">true</item>\n'
              '    </style>\n'
              '</resources>\n'
          )

          files[f"{RES}/xml/network_security_config.xml"] = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <domain-config cleartextTrafficPermitted="false">\n'
              '        <domain includeSubdomains="true">ai-health-tracker-yycb.onrender.com</domain>\n'
              '    </domain-config>\n'
              '    <base-config cleartextTrafficPermitted="false">\n'
              '        <trust-anchors>\n'
              '            <certificates src="system"/>\n'
              '        </trust-anchors>\n'
              '    </base-config>\n'
              '</network-security-config>\n'
          )

          for path, content in files.items():
              with open(path, "w") as f:
                  f.write(content)
              print(f"Written: {path}")
          PYEOF

      - name: Write AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          # IMPORTANT:
          # 1. <queries> block MUST be present so HealthConnectClient.getSdkStatus()
          #    can detect com.google.android.apps.healthdata on Android 11+.
          # 2. Do NOT register androidx.health.connect.client.impl.* internal classes.
          # 3. <queries> is a sibling of <application>, NOT inside it.
          content = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '\n'
              '    <!-- Required so HealthConnectClient.getSdkStatus() can detect the\n'
              '         Health Connect provider on Android 11+ (package visibility). -->\n'
              '    <queries>\n'
              '        <package android:name="com.google.android.apps.healthdata" />\n'
              '    </queries>\n'
              '\n'
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
              '\n'
              '    <!-- Health Connect READ permissions -->\n'
              '    <uses-permission android:name="android.permission.health.READ_STEPS" />\n'
              '    <uses-permission android:name="android.permission.health.READ_DISTANCE" />\n'
              '    <uses-permission android:name="android.permission.health.READ_HEART_RATE" />\n'
              '    <uses-permission android:name="android.permission.health.READ_RESTING_HEART_RATE" />\n'
              '    <uses-permission android:name="android.permission.health.READ_HEART_RATE_VARIABILITY" />\n'
              '    <uses-permission android:name="android.permission.health.READ_OXYGEN_SATURATION" />\n'
              '    <uses-permission android:name="android.permission.health.READ_RESPIRATORY_RATE" />\n'
              '    <uses-permission android:name="android.permission.health.READ_SLEEP" />\n'
              '    <uses-permission android:name="android.permission.health.READ_EXERCISE" />\n'
              '    <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED" />\n'
              '    <uses-permission android:name="android.permission.health.READ_TOTAL_CALORIES_BURNED" />\n'
              '    <uses-permission android:name="android.permission.health.READ_VO2_MAX" />\n'
              '\n'
              '    <application\n'
              '        android:allowBackup="true"\n'
              '        android:icon="@mipmap/ic_launcher"\n'
              '        android:roundIcon="@mipmap/ic_launcher_round"\n'
              '        android:label="@string/app_name"\n'
              '        android:supportsRtl="true"\n'
              '        android:theme="@style/AppTheme"\n'
              '        android:networkSecurityConfig="@xml/network_security_config"\n'
              '        android:usesCleartextTraffic="false">\n'
              '\n'
              '        <activity\n'
              '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"\n'
              '            android:name="com.nalamudan.healthtracker.MainActivity"\n'
              '            android:label="@string/title_activity_main"\n'
              '            android:theme="@style/AppTheme.NoActionBarLaunch"\n'
              '            android:launchMode="singleTask"\n'
              '            android:exported="true"\n'
              '            android:screenOrientation="portrait">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.MAIN" />\n'
              '                <category android:name="android.intent.category.LAUNCHER" />\n'
              '            </intent-filter>\n'
              '        </activity>\n'
              '\n'
              '        <!-- NOTE: Do NOT register\n'
              '             androidx.health.connect.client.impl.platform.PermissionsActivity\n'
              '             here. The HC SDK registers its own permission activity internally.\n'
              '             Manually registering internal implementation classes breaks the\n'
              '             permission flow. -->\n'
              '\n'
              '        <provider\n'
              '            android:name="androidx.core.content.FileProvider"\n'
              '            android:authorities="${applicationId}.fileprovider"\n'
              '            android:exported="false"\n'
              '            android:grantUriPermissions="true">\n'
              '            <meta-data\n'
              '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
              '                android:resource="@xml/file_paths" />\n'
              '        </provider>\n'
              '\n'
              '    </application>\n'
              '</manifest>\n'
          )
          with open("frontend/android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(content)
          print("AndroidManifest.xml written")
          PYEOF

      - name: Write file_paths.xml and MainActivity
        run: |
          python3 << 'PYEOF'
          import os

          xml_dir = "frontend/android/app/src/main/res/xml"
          os.makedirs(xml_dir, exist_ok=True)
          with open(f"{xml_dir}/file_paths.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<paths xmlns:android="http://schemas.android.com/apk/res/android">\n')
              f.write('    <external-path name="my_images" path="." />\n')
              f.write('    <cache-path name="my_cache_files" path="." />\n')
              f.write('</paths>\n')

          java_dir = "frontend/android/app/src/main/java/com/nalamudan/healthtracker"
          os.makedirs(java_dir, exist_ok=True)
          with open(f"{java_dir}/MainActivity.kt", "w") as f:
              f.write('package com.nalamudan.healthtracker\n\n')
              f.write('import com.getcapacitor.BridgeActivity\n')
              f.write('import android.os.Bundle\n\n')
              f.write('class MainActivity : BridgeActivity() {\n')
              f.write('    override fun onCreate(savedInstanceState: Bundle?) {\n')
              f.write('        registerPlugin(HealthConnectPlugin::class.java)\n')
              f.write('        super.onCreate(savedInstanceState)\n')
              f.write('    }\n')
              f.write('}\n')

          print("file_paths.xml and MainActivity.kt written")
          PYEOF

      - name: Copy HealthConnectPlugin source
        run: |
          DEST="frontend/android/app/src/main/java/com/nalamudan/healthtracker"
          mkdir -p "$DEST"
          cp frontend/android-plugin/HealthConnectPlugin.kt "$DEST/HealthConnectPlugin.kt"
          echo "HealthConnectPlugin.kt copied"

      - name: Patch minSdk and add Health Connect dependency
        run: |
          python3 << 'PYEOF'
          import re, os

          # ── 1. variables.gradle (Capacitor 6 stores minSdkVersion here) ──
          # Health Connect 1.1.0-rc01 requires compileSdk 36 and AGP 8.9.1+.
          # AGP 8.10.0 supports API 36 and requires Gradle 8.11.1 (JDK 17 is configured).
          root_gradle_path = "frontend/android/build.gradle"
          with open(root_gradle_path) as f:
              root_gradle = f.read()
          root_gradle, agp_count = re.subn(
              r"classpath\s+['\"]com\.android\.tools\.build:gradle:[^'\"]+['\"]",
              "classpath 'com.android.tools.build:gradle:8.10.0'",
              root_gradle,
              count=1
          )
          if agp_count != 1:
              raise RuntimeError("Could not find the generated Android Gradle Plugin declaration")
          with open(root_gradle_path, "w") as f:
              f.write(root_gradle)

          wrapper_path = "frontend/android/gradle/wrapper/gradle-wrapper.properties"
          with open(wrapper_path) as f:
              wrapper = f.read()
          wrapper, gradle_count = re.subn(
              r"gradle-[0-9.]+-(?:all|bin)\.zip",
              "gradle-8.11.1-all.zip",
              wrapper,
              count=1
          )
          if gradle_count != 1:
              raise RuntimeError("Could not find the generated Gradle wrapper distribution")
          with open(wrapper_path, "w") as f:
              f.write(wrapper)

          var_path = "frontend/android/variables.gradle"
          if os.path.exists(var_path):
              with open(var_path) as f:
                  v = f.read()
              print("variables.gradle BEFORE:", v)
              v = re.sub(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', v)
              v = re.sub(r'(minSdkVersion\s+)\d+',     r'\g<1>26', v)
              v = re.sub(r'(compileSdkVersion\s*=\s*)\d+', r'\g<1>36', v)
              v = re.sub(r'(compileSdkVersion\s+)\d+',     r'\g<1>36', v)
              v = re.sub(r'(targetSdkVersion\s*=\s*)\d+', r'\g<1>34', v)
              v = re.sub(r'(targetSdkVersion\s+)\d+',     r'\g<1>34', v)
              with open(var_path, "w") as f:
                  f.write(v)
              print("variables.gradle AFTER:", v)
          else:
              print("WARNING: variables.gradle not found at", var_path)

          # ── 2. app/build.gradle (patch inline minSdk + add HC dependency) ──
          gradle_path = "frontend/android/app/build.gradle"
          with open(gradle_path) as f:
              g = f.read()
          print("build.gradle BEFORE:", g)

          g = re.sub(r'(minSdkVersion\s+)\d+',    r'\g<1>26', g)
          g = re.sub(r'(minSdkVersion\s*=\s*)\d+', r'\g<1>26', g)
          g = re.sub(r'(minSdk\s+)\d+',            r'\g<1>26', g)
          g = re.sub(r'(minSdk\s*=\s*)\d+',        r'\g<1>26', g)
          g = re.sub(r'(compileSdkVersion\s+)\d+',    r'\g<1>36', g)
          g = re.sub(r'(compileSdkVersion\s*=\s*)\d+', r'\g<1>36', g)
          g = re.sub(r'(compileSdk\s+)\d+',            r'\g<1>36', g)
          g = re.sub(r'(compileSdk\s*=\s*)\d+',        r'\g<1>36', g)

          # Keep the official Health Connect client version; its metadata requirements
          # are satisfied by compileSdk 36 and AGP 8.10.0 below.
          hc_dep = '    implementation "androidx.health.connect:connect-client:1.1.0-rc01"'
          if 'androidx.health.connect' not in g:
              g = g.replace('dependencies {', 'dependencies {\n' + hc_dep)
          else:
              # Update any existing HC dep to the correct version
              g = re.sub(
                  r'implementation\s+"androidx\.health\.connect:connect-client:[^"]*"',
                  'implementation "androidx.health.connect:connect-client:1.1.0-rc01"',
                  g
              )

          with open(gradle_path, "w") as f:
              f.write(g)
          print("build.gradle AFTER:", g)
          PYEOF

      - name: Configure Gradle
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "Gradle configured"

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:checkDebugAarMetadata --no-daemon --stacktrace
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Pandroid.injected.testOnly=false
          echo "APK built successfully"

      - name: Verify APK application icon
        run: |
          set -euo pipefail
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.nalamudan.healthtracker'"
          "$AAPT" dump badging "$APK" | grep -E "^application-icon(-[0-9]+)?:"

      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          SRC="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="frontend/android/app/build/outputs/apk/debug/Nalamudan-v5-${DATE}.apk"
          cp "$SRC" "$DEST"
          echo "APK ready: $(du -sh $SRC | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nalamudan-APK
          path: |
            frontend/android/app/build/outputs/apk/debug/Nalamudan-*.apk
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5-${{ github.run_number }}
          name: "Nalamudan - Build ${{ github.run_number }}"
          body: "Nalamudan Health Tracker. Backend: https://ai-health-tracker-yycb.onrender.com"
          files: frontend/android/app/build/outputs/apk/debug/Nalamudan-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Build summary
        run: |
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "## Nalamudan APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | com.nalamudan.healthtracker |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | $(du -sh $APK | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | https://ai-health-tracker-yycb.onrender.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
