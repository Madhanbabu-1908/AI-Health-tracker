      # ============================================================
      # 14. FILE PATHS + MAIN ACTIVITY
      # ============================================================
      - name: Write file_paths.xml and MainActivity
        run: |
          python3 << 'PYEOF'

          import os

          # --------------------------------------------------------
          # file_paths.xml
          # --------------------------------------------------------
          xml_dir = "frontend/android/app/src/main/res/xml"

          os.makedirs(xml_dir, exist_ok=True)

          with open(f"{xml_dir}/file_paths.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<paths xmlns:android="http://schemas.android.com/apk/res/android">\n')
              f.write('    <external-path name="my_images" path="." />\n')
              f.write('    <cache-path name="my_cache_files" path="." />\n')
              f.write('</paths>\n')

          # --------------------------------------------------------
          # MainActivity.kt
          # --------------------------------------------------------
          java_dir = (
              "frontend/android/app/src/main/java/"
              "com/nalamudan/healthtracker"
          )

          os.makedirs(java_dir, exist_ok=True)

          with open(f"{java_dir}/MainActivity.kt", "w") as f:

              f.write(
                  "package com.nalamudan.healthtracker\n\n"
              )

              f.write(
                  "import com.getcapacitor.BridgeActivity\n"
              )

              f.write(
                  "import android.os.Bundle\n\n"
              )

              f.write(
                  "class MainActivity : BridgeActivity() {\n"
              )

              f.write(
                  "    override fun onCreate(savedInstanceState: Bundle?) {\n"
              )

              f.write(
                  "        registerPlugin(HealthConnectPlugin::class.java)\n"
              )

              f.write(
                  "        super.onCreate(savedInstanceState)\n"
              )

              f.write(
                  "    }\n"
              )

              f.write(
                  "}\n"
              )

          print("file_paths.xml and MainActivity.kt written")

          PYEOF

      # ============================================================
      # 15. HEALTH CONNECT PLUGIN
      # ============================================================
      - name: Copy HealthConnectPlugin source
        run: |
          DEST="frontend/android/app/src/main/java/com/nalamudan/healthtracker"

          mkdir -p "$DEST"

          cp \
            frontend/android-plugin/HealthConnectPlugin.kt \
            "$DEST/HealthConnectPlugin.kt"

          echo "HealthConnectPlugin.kt copied"

      # ============================================================
      # 16. HEALTH CONNECT DEPENDENCY
      #
      # Keep the existing dependency from your project.
      # This step only injects it if it is not already present.
      # ============================================================
      - name: Add Health Connect dependency to app build.gradle
        run: |
          python3 << 'PYEOF'

          import re

          gradle_path = "frontend/android/app/build.gradle"

          with open(gradle_path, "r") as f:
              content = f.read()

          # --------------------------------------------------------
          # Health Connect requires minSdkVersion 26
          # --------------------------------------------------------
          content = re.sub(
              r'minSdkVersion\s+\d+',
              'minSdkVersion 26',
              content
          )

          # --------------------------------------------------------
          # Add Health Connect dependency if missing
          # --------------------------------------------------------
          hc_dep = (
              '    implementation '
              '"androidx.health.connect:connect-client:1.1.0-alpha10"'
          )

          if 'androidx.health.connect' not in content:

              content = content.replace(
                  'dependencies {',
                  'dependencies {\n' + hc_dep
              )

          with open(gradle_path, "w") as f:
              f.write(content)

          print(
              "build.gradle updated with Health Connect dependency"
          )

          PYEOF

      # ============================================================
      # 17. GRADLE CONFIGURATION
      # ============================================================
      - name: Configure Gradle
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC" \
            >> gradle.properties

          echo "org.gradle.caching=true" \
            >> gradle.properties

          echo "org.gradle.parallel=true" \
            >> gradle.properties

          echo "android.useAndroidX=true" \
            >> gradle.properties

          echo "android.enableJetifier=true" \
            >> gradle.properties

          echo "Gradle configured"

      # ============================================================
      # 18. VERIFY GRADLE ENVIRONMENT
      # ============================================================
      - name: Verify Gradle environment
        working-directory: frontend/android
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed Android packages:"
          sdkmanager --list_installed || true

      # ============================================================
      # 19. BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Pandroid.injected.testOnly=false

          echo "APK built successfully"

      # ============================================================
      # 20. RENAME APK
      # ============================================================
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')

          SRC="frontend/android/app/build/outputs/apk/debug/app-debug.apk"

          DEST="frontend/android/app/build/outputs/apk/debug/Nalamudan-v4-${DATE}.apk"

          cp "$SRC" "$DEST"

          SIZE=$(du -sh "$SRC" | cut -f1)

          echo "APK ready: $SIZE"

      # ============================================================
      # 21. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nalamudan-APK
          path: |
            frontend/android/app/build/outputs/apk/debug/Nalamudan-*.apk
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ============================================================
      # 22. CREATE GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-${{ github.run_number }}
          name: "Nalamudan - Build ${{ github.run_number }}"
          body: |
            Nalamudan Health + Wealth Tracker.

            Backend:
            https://ai-health-tracker-yycb.onrender.com
          files: frontend/android/app/build/outputs/apk/debug/Nalamudan-*.apk
          make_latest: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 23. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        run: |
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "## Nalamudan APK Build Complete" \
            >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" \
            >> $GITHUB_STEP_SUMMARY

          echo "|----------|-------|" \
            >> $GITHUB_STEP_SUMMARY

          echo "| App ID | com.nalamudan.healthtracker |" \
            >> $GITHUB_STEP_SUMMARY

          echo "| APK Size | $(du -sh "$APK" | cut -f1) |" \
            >> $GITHUB_STEP_SUMMARY

          echo "| Backend | https://ai-health-tracker-yycb.onrender.com |" \
            >> $GITHUB_STEP_SUMMARY

          echo "| Build | ${{ github.run_number }} |" \
            >> $GITHUB_STEP_SUMMARY

          echo "| Health Connect | Enabled |" \
            >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "========================================"
          echo " NALAMUDAN APK BUILD SUCCESSFUL"
          echo "========================================"
